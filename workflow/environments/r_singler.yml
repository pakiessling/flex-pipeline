# r_singler.yml — R environment for SingleR label transfer (04_singleR.R).
# Used by: 04_singleR.R
name: flex-r-singler
channels:
  - nodefaults
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.3
  - bioconductor-singler>=2.4,<3               # minor-locked: label transfer algorithm
  - bioconductor-singlecellexperiment>=1.24,<2 # minor-locked
  - bioconductor-biocparallel>=1.36,<2         # major-locked
  - r-argparser>=0.7,<1                        # major-locked
  - r-ggplot2>=3.4,<4                          # major-locked
  - bioconductor-rhdf5 >=2.56,<3                         # major-locked
  - bioconductor-anndataR>=1.2,<2
 
